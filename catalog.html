<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05222b"><title>Ürün Kataloğu · Tidex Technology</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#eef4f5;--card:#fff;--tx:#10242b;--mu:#64757b;--ln:#d7e1e4;--ac:#0db8cc;--ac2:#dff7fa;--ok:#16834d;--bad:#bd3b45;--sh:0 12px 35px rgba(5,34,43,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 18px}.brand b{display:block;font-size:18px}.brand small{color:var(--mu)}button,input,textarea{font:inherit}button{border:0;border-radius:14px;padding:12px 14px;cursor:pointer}.cartbtn{background:var(--tx);color:#fff;font-weight:800}.search{width:100%;padding:14px;border:1px solid var(--ln);border-radius:16px;background:#fff;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}.media{aspect-ratio:1/1;background:#e8eef0;display:flex;align-items:center;justify-content:center;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:42px}.body{padding:14px}.body h3{margin:0 0 6px;font-size:16px}.desc{color:var(--mu);font-size:13px;line-height:1.45;min-height:38px}.price{font-size:18px;font-weight:900;margin:10px 0}.add{width:100%;background:var(--ac);color:#fff;font-weight:800}.panel{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:min(760px,100%);margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--ln);padding:12px 0}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:7px 10px;background:var(--ac2)}.field{margin-top:12px}.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:13px}.submit{width:100%;margin-top:15px;background:var(--ok);color:#fff;font-weight:900}.empty,.msg{text-align:center;padding:35px 10px;color:var(--mu)}.ok{color:var(--ok);font-weight:800}.err{color:var(--bad);white-space:pre-wrap}.thumbs{display:flex;gap:7px;margin-top:8px}.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:9px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:50}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-left:10px;padding-right:10px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand"><b>🛍️ Tidex Technology</b><small id="shopname">Ürün Kataloğu</small></div><button class="cartbtn" onclick="openCart()">🛒 Sepet <span id="count">0</span></button></div><input class="search" id="search" placeholder="🔎 Ürün ara..." oninput="renderProducts()"><div id="msg" class="msg">Katalog yükleniyor…</div><div id="products" class="grid"></div></main><div id="panel" class="panel" onclick="if(event.target===this)closeCart()"><section class="sheet"><div class="sheethead"><h2 style="margin:0">🛒 Siparişiniz</h2><button onclick="closeCart()">✕</button></div><div id="cart"></div><div id="checkout"></div></section></div><div id="toast" class="toast"></div><script>
const URL='https://woogrfdcjonaurwgwoor.supabase.co',KEY='sb_publishable_PD0uw5raOZWLs8n0W6iPMA_ILeoWdcm',sb=supabase.createClient(URL,KEY);const wid=new URLSearchParams(location.search).get('w');let catalog={products:[]},cart=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);
function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
async function load(){if(!wid){$('msg').innerHTML='<span class="err">Katalog bağlantısı eksik.</span>';return}const {data,error}=await sb.rpc('get_public_catalog',{p_workspace_id:wid});if(error||!data){$('msg').innerHTML='<span class="err">Katalog yüklenemedi.<br>'+esc(error?.message||'Bilinmeyen hata')+'</span>';return}catalog=data;$('shopname').textContent=data.name||'Ürün Kataloğu';$('msg').remove();renderProducts()}
function renderProducts(){const q=($('search').value||'').toLocaleLowerCase('tr');const ps=(catalog.products||[]).filter(p=>(p.name||'').toLocaleLowerCase('tr').includes(q)||(p.description||'').toLocaleLowerCase('tr').includes(q));$('products').innerHTML=ps.length?ps.map(p=>`<article class="card"><div class="media">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="placeholder">🧩</div>'}</div><div class="body"><h3>${esc(p.name)}</h3><div class="desc">${esc(p.description||'')}</div><div class="price">${money(p.price)}</div><button class="add" onclick="add('${p.id}')">🛒 Sepete ekle</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Aradığınız ürün bulunamadı.</div>'}
function add(id){const p=catalog.products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.product_id===id);if(x)x.qty++;else cart.push({product_id:id,name:p.name,price:Number(p.price),qty:1});updateCount();toast('Ürün sepete eklendi')}
function updateCount(){$('count').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function change(id,d){const x=cart.find(x=>x.product_id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.product_id!==id);renderCart();updateCount()}
function openCart(){$('panel').style.display='flex';renderCart()}
function closeCart(){$('panel').style.display='none'}
function renderCart(){const total=cart.reduce((a,x)=>a+x.price*x.qty,0);$('cart').innerHTML=cart.length?cart.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${money(x.price)} / adet</small></div><div class="qty"><button onclick="change('${x.product_id}',-1)">−</button><b>${x.qty}</b><button onclick="change('${x.product_id}',1)">+</button></div><b>${money(x.price*x.qty)}</b></div>`).join('')+`<div style="display:flex;justify-content:space-between;padding:16px 0;font-size:18px"><b>Toplam</b><b>${money(total)}</b></div>`:'<div class="empty">Sepetiniz boş.</div>';$('checkout').innerHTML=cart.length?`<h3>Sipariş bilgileri</h3><div class="field"><label>Ad Soyad *</label><input id="cn" placeholder="Adınız Soyadınız"></div><div class="field"><label>Telefon</label><input id="cp" type="tel" placeholder="05xx xxx xx xx"></div><div class="field"><label>Sipariş notu</label><textarea id="co" rows="3" placeholder="Renk, özel istek vb."></textarea></div><button class="submit" onclick="submitOrder()">✅ Siparişi gönder</button>`:''}
async function submitOrder(){const name=($('cn').value||'').trim();if(!name){toast('Lütfen adınızı yazın.');return}if(!cart.length)return;const {data,error}=await sb.rpc('submit_catalog_order',{p_workspace_id:wid,p_customer_name:name,p_phone:($('cp').value||'').trim(),p_note:($('co').value||'').trim(),p_items:cart.map(x=>({product_id:x.product_id,qty:x.qty}))});if(error){toast('Sipariş gönderilemedi');console.error(error);return}const no=data?.[0]?.order_group||data?.order_group||'CAT';const total=data?.[0]?.total||data?.total||0;cart=[];updateCount();$('cart').innerHTML=`<div class="empty"><div style="font-size:42px">✅</div><h3>Siparişiniz alındı</h3><p>Sipariş no: <b>${esc(no)}</b></p><p>Toplam: <b>${money(total)}</b></p><p>Teşekkür ederiz. Siparişiniz kontrol edildikten sonra üretime alınacaktır.</p><button class="cartbtn" onclick="closeCart()">Kataloğa dön</button></div>`;$('checkout').innerHTML='';}
load();
</script></body></html>
