<script>
const SUPABASE_URL='https://woogrfdcjonaurwgwoor.supabase.co';
const SUPABASE_KEY='sb_publishable_PD0uw5raOZWLs8n0W6iPMA_ILeoWdcm';
let sb=null;
const wid=(new URLSearchParams(location.search).get('w')||'a5af67d1-a235-421a-9996-5ed7bada68c3');
let catalog={products:[],categories:[]},cart=loadSavedCart(),activeCategory='Tümü',sending=false;
function loadSavedCart(){try{const v=JSON.parse(sessionStorage.getItem('tidex-cart')||'[]');return Array.isArray(v)?v.filter(x=>x&&x.product_id&&Number.isFinite(Number(x.qty))&&Number(x.qty)>0):[]}catch(e){return []}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);
function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
async function load(){
  try{
    if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase bağlantı kütüphanesi yüklenemedi.');
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {data,error}=await sb.rpc('get_public_catalog',{p_workspace_id:wid});
    if(error||!data)throw error||new Error('Katalog verisi alınamadı.');
    catalog=typeof data==='string'?JSON.parse(data):data;
    if(!catalog||!Array.isArray(catalog.products))throw new Error('Katalog verisi beklenen formatta değil.');
    catalog.products=catalog.products.filter(p=>p.catalogVisible!==false&&p.catalogActive!==false);
    const cats=[...new Set(catalog.products.map(p=>(p.catalogCategory||'').trim()).filter(Boolean))];
    renderCategories();
    $('msg').remove();renderProducts();renderCart();updateCount();
  }catch(e){console.error(e);$('msg').innerHTML='<div class="err">Katalog yüklenemedi.<br>'+esc(e?.message||e)+'</div><button class="cartbtn" style="margin-top:12px" onclick="retryLoad()">Tekrar dene</button>'}
}
function retryLoad(){$('msg').textContent='Katalog yeniden yükleniyor…';load()}
function normCategory(c){return String(c??'').trim().toLocaleLowerCase('tr-TR')}
function renderCategories(){
 const cats=[...new Set(catalog.products.map(p=>(p.catalogCategory||'').trim()).filter(Boolean))];
 const values=['Tümü',...cats,'Çok Satanlar'];
 $('categories').innerHTML=values.map(c=>{const on=normCategory(c)===normCategory(activeCategory);const encoded=encodeURIComponent(c);return `<button type="button" class="chip ${on?'on':''}" data-category="${esc(c)}" aria-pressed="${on?'true':'false'}" onclick="setCategory(decodeURIComponent('${encoded}'))">${esc(c)}</button>`}).join('');
}
// Delegated click handler is robust even when category buttons are re-rendered.
document.addEventListener('click',event=>{const button=event.target.closest('button[data-category]');if(!button||!$('categories')||!$('categories').contains(button))return;event.preventDefault();setCategory(button.getAttribute('data-category'));});
function setCategory(c){activeCategory=String(c||'Tümü').trim()||'Tümü';renderCategories();renderProducts();$('categories').querySelectorAll('[data-category]').forEach(b=>{const selected=normCategory(b.getAttribute('data-category'))===normCategory(activeCategory);b.classList.toggle('on',selected);b.setAttribute('aria-pressed',selected?'true':'false')});}

function renderProducts(){
 const q=($('search').value||'').toLocaleLowerCase('tr').trim();
 const eligible=(catalog.products||[]).filter(p=>{const pc=String(p.catalogCategory||'').trim().toLocaleLowerCase('tr');const selected=String(activeCategory||'Tümü').trim().toLocaleLowerCase('tr');const categoryOK=selected==='tümü'||(selected==='çok satanlar'?!!p.catalogBestSeller:pc===selected);const text=((p.name||p.n||'').toLocaleLowerCase('tr').includes(q))||((p.catalogDescription||p.description||p.desc||'').toLocaleLowerCase('tr').includes(q));return categoryOK&&text});
 const draw=ps=>ps.length?ps.map(p=>{
  const image=p.catalogImage||p.image||'',video=p.catalogVideo||p.video||'',name=p.name||p.n||'Ürün',desc=p.catalogDescription||p.description||p.desc||'',price=Number(p.price??p.fiyat??0),min=Math.max(1,Math.floor(Number(p.catalogMin)||25)),step=Math.max(1,Math.floor(Number(p.catalogStep)||25));
  const media=video?`<video src="${esc(video)}" controls playsinline preload="metadata" aria-label="${esc(name)} ürün videosu" poster="${esc(image)}"></video>`:image?`<img src="${esc(image)}" alt="${esc(name)}" loading="lazy">`:'<div class="placeholder">✦</div>';
  const inCart=cart.find(x=>x.product_id===p.id),qty=inCart?inCart.qty:min;
  return `<article class="card"><div class="media">${media}<span class="tag">${p.catalogBestSeller?'Çok satan':esc(p.catalogCategory||'Ürün')}</span></div><div class="body"><h3>${esc(name)}</h3><div class="desc">${esc(desc)}</div><div class="price">${money(price)}</div><small>Minimum ${min} adet · ${step}’er adet artar</small><div class="qty" style="margin:10px 0"><button onclick="cardQty('${esc(p.id)}',-1)">−</button><b id="q_${esc(p.id)}">${qty}</b><button onclick="cardQty('${esc(p.id)}',1)">+</button></div><button class="add" onclick="add('${esc(p.id)}')">🛒 Sepete ekle</button></div></article>`
 }).join(''):'<div class="empty">Aradığınız ürün bulunamadı.</div>';
 $('products').innerHTML=draw(eligible);
}
function persistCart(){try{sessionStorage.setItem('tidex-cart',JSON.stringify(cart))}catch(e){}}
function cardQty(id,d){const p=catalog.products.find(x=>x.id===id);if(!p)return;const min=Math.max(1,Math.floor(Number(p.catalogMin)||25)),step=Math.max(1,Math.floor(Number(p.catalogStep)||25)),x=cart.find(x=>x.product_id===id);if(!x&&d<0)return;let q=x?x.qty:min;q=Math.max(min,q+d*step);if(x)x.qty=q;else cart.push({product_id:id,name:p.name||p.n||'Ürün',price:Number(p.price??p.fiyat??0),qty:q,min,step});persistCart();updateCount();renderProducts();renderCart()}
function add(id){const p=catalog.products.find(x=>x.id===id);if(!p)return;const min=Math.max(1,Math.floor(Number(p.catalogMin)||25)),step=Math.max(1,Math.floor(Number(p.catalogStep)||25)),x=cart.find(x=>x.product_id===id);if(x)x.qty=Math.max(min,x.qty+step);else cart.push({product_id:id,name:p.name||p.n||'Ürün',price:Number(p.price??p.fiyat??0),qty:min,min,step});persistCart();updateCount();renderCart();toast('Ürün sepete eklendi')}
function updateCount(){$('count').textContent=cart.reduce((a,x)=>a+x.qty,0);persistCart()}
function change(id,d){const x=cart.find(x=>x.product_id===id);if(!x)return;const min=Math.max(1,x.min||25),step=Math.max(1,x.step||25);if(d<0&&x.qty-step<min)cart=cart.filter(y=>y.product_id!==id);else x.qty=Math.max(min,x.qty+d*step);persistCart();renderCart();updateCount();renderProducts()}
function openCart(){$('panel').style.display='block';renderCart();$('panel').scrollIntoView({behavior:'smooth',block:'start'})}
function closeCart(){$('panel').style.display='none';}
function renderCart(){
 const total=cart.reduce((a,x)=>a+x.price*x.qty,0);
 $('cart').innerHTML=cart.length?cart.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${money(x.price)} / adet · minimum ${Math.max(1,x.min||25)} adet</small></div><div class="qty"><button onclick="change('${x.product_id}',-1)">−${Math.max(1,x.step||25)}</button><b>${x.qty} adet</b><button onclick="change('${x.product_id}',1)">+${Math.max(1,x.step||25)}</button></div><b>${money(x.price*x.qty)}</b></div>`).join('')+`<div class="total"><b>Toplam</b><b>${money(total)}</b></div>`:'<div class="empty">Sepetiniz şu an boş.</div>';
 $('checkout').innerHTML=cart.length?`<div class="checkout"><h3>Sipariş bilgileri</h3><div class="field"><label>Ad Soyad <span class="req">Zorunlu</span></label><input id="cn" autocomplete="name" placeholder="Adınız Soyadınız"></div><div class="field"><label>Telefon <span class="req">Zorunlu</span></label><input id="cp" type="tel" inputmode="tel" autocomplete="tel" required placeholder="05xx xxx xx xx"><div class="note">Siparişinizle ilgili size ulaşabilmemiz için telefon numaranız gereklidir.</div></div><div class="field"><label>Sipariş notu <span>İsteğe bağlı</span></label><textarea id="co" rows="3" placeholder="Renk, ölçü veya özel isteğiniz varsa yazabilirsiniz."></textarea></div><button class="submit" onclick="submitOrder()">✓ Siparişi gönder</button></div>`:'';
}
async function submitOrder(){
 if(sending)return;
 try{
  const name=($('cn').value||'').trim(),phone=($('cp').value||'').trim();
  if(!name){toast('Lütfen ad soyadınızı yazın.');$('cn').focus();return}
  if(phone.replace(/\D/g,'').length<10){toast('Lütfen geçerli bir telefon numarası yazın.');$('cp').focus();return}
  if(!cart.length)return;
  for(const x of cart){const p=catalog.products.find(p=>p.id===x.product_id);if(!p)throw new Error('Sepette artık bulunmayan bir ürün var. Lütfen sepeti yenileyin.');const min=Math.max(1,Math.floor(Number(p.catalogMin)||25)),step=Math.max(1,Math.floor(Number(p.catalogStep)||25));if(x.qty<min||(x.qty-min)%step!==0)throw new Error(x.name+' için minimum/adet artışı kuralı sağlanmıyor.')}
  sending=true;const btn=document.querySelector('.submit');if(btn){btn.disabled=true;btn.textContent='Gönderiliyor…'}
  const {data,error}=await sb.rpc('submit_catalog_order',{p_workspace_id:wid,p_customer_name:name,p_phone:phone,p_note:($('co').value||'').trim(),p_items:cart.map(x=>({product_id:x.product_id,qty:x.qty}))});
  if(error)throw error;
  const no=data?.[0]?.order_group||data?.order_group||'CAT',total=data?.[0]?.total||data?.total||0;
  cart=[];persistCart();sending=false;updateCount();$('cart').innerHTML=`<div class="empty"><div style="font-size:42px">✓</div><h3>Siparişiniz alındı</h3><p>Sipariş numaranız: <b>${esc(no)}</b></p><p>Toplam: <b>${money(total)}</b></p><p>Siparişiniz kontrol edildikten sonra hazırlanacaktır. Teşekkür ederiz.</p><button class="cartbtn" onclick="closeCart()">Alışverişe devam et</button></div>`;$('checkout').innerHTML='';
 }catch(e){sending=false;console.error(e);toast('Sipariş gönderilemedi: '+(e?.message||e));if($('checkout').querySelector('.submit')){$('checkout').querySelector('.submit').disabled=false;$('checkout').querySelector('.submit').textContent='✓ Siparişi gönder'}}
}
load();
</script>
