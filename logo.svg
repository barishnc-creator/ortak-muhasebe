<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tidex Technology">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1BB3C6"/>
      <stop offset=".62" stop-color="#0E7F93"/>
      <stop offset="1" stop-color="#0A5568"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9FBFF"/>
      <stop offset="1" stop-color="#5FE6F2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inner"><circle cx="256" cy="256" r="178"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Işıklı halka -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ring)" stroke-width="22" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="178" fill="#0B6476" opacity=".35"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#DFFBFF" stroke-width="3" opacity=".65"/>
  <g clip-path="url(#inner)">
    <!-- Yazıcı rayı -->
    <rect x="60" y="150" width="392" height="16" rx="3" fill="#E9FCFF"/>
    <rect x="60" y="150" width="392" height="5" fill="#FFFFFF" opacity=".7"/>
  </g>
  <!-- Baskı başlığı -->
  <rect x="216" y="124" width="80" height="62" rx="10" fill="#F4FEFF"/>
  <rect x="216" y="124" width="80" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="234" y="148" width="44" height="26" rx="5" fill="#0E7F93" opacity=".22"/>
  <path d="M236 186h40l-10 22h-20z" fill="#E9FCFF"/>
  <path d="M250 208h12l-6 12z" fill="#7BF0FA"/>
  <rect x="242" y="104" width="28" height="22" rx="4" fill="#E9FCFF"/>
  <!-- X: iki kalın çapraz; üstteki çapraz ince bir çizgiyle ayrılır -->
  <path d="M344 238h-66L168 402h66z" fill="#FFFFFF"/>
  <path d="M168 238h66l110 164h-66z" fill="#FFFFFF" stroke="#0F8598" stroke-width="9" stroke-linejoin="round" paint-order="stroke"/>
  <path d="M168 238h66l110 164h-66z" fill="#FFFFFF"/>
</svg>
